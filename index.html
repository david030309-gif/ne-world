<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ne World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
/* VOICE: a Russian-language city newsroom at night: fast, confident, scannable.
   IDEA: the existing Ne Alpy site, plus a night-side globe you spin to pick your country.
   PICTURE: a dark globe with Switzerland and the UK lit red; the rest of the world waits in grey.
   COLOUR and TYPE: near-black ground, graphite cards, one red; Unbounded headlines, Onest body.
   LAYOUT: picker = globe centred with two country cards; feed = copy of the live site per region. */
:root{color-scheme:dark;--bg:#0c0c0d;--card:#1b1b1d;--card2:#242427;--line:#2c2c30;--ink:#f3f3f4;--mut:#9a9aa1;--red:#e4232f;--land:#2a2b30;--hi:#e4232f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.h{font-family:Unbounded,Onest,sans-serif;font-weight:800;line-height:1.12;text-wrap:balance;margin:0}
[hidden]{display:none!important}

/* ---------- picker ---------- */
#picker{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(120% 80% at 50% 45%,#17171b 0,#0c0c0d 60%)}
.ptop{padding:20px max(5vw,16px) 0;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:Unbounded;font-weight:800;font-size:20px;margin-bottom:10px}
.brand svg{width:34px;height:34px}
.ptop .h{font-size:clamp(28px,4.4vw,46px)}
.ptop p{color:var(--mut);margin:10px auto 0;max-width:46ch}
.globewrap{position:relative;display:grid;place-items:center;padding:8px 0}
#gslot{--g:max(240px,min(540px,92vw,calc(100vh - 390px),calc(100dvh - 390px)));width:var(--g);height:var(--g)}
#globe{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;z-index:0;will-change:transform,opacity}
#picker>.ptop,#picker>.globewrap,#picker>.choices{position:relative;z-index:1;pointer-events:none;transition:opacity .25s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1)}
#picker .choice{pointer-events:auto}
#picker.flying>.ptop{opacity:0;transform:translateY(-14px)}
#picker.flying>.choices,#picker.flying>.globewrap .hint{opacity:0;transform:translateY(14px)}
#picker .hint{transition:opacity .25s,transform .3s}
#veil{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:4;transition:opacity .3s cubic-bezier(.4,0,.2,1)}
#picker.out #veil{opacity:1}
#tip{z-index:5}
#globe.grab{cursor:grab}#globe.ptr{cursor:pointer}#globe.drag{cursor:grabbing}
#tip{position:fixed;pointer-events:none;background:#000c;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .12s}
#tip b{color:var(--red);font-weight:600}
.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--mut);white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,280px));gap:12px;justify-content:center;padding:4px max(5vw,16px) 18px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:76px;transition:border-color .15s,transform .15s}
.choice:hover,.choice.on{border-color:var(--red);transform:translateY(-2px)}
.choice img{width:64px;height:48px;object-fit:contain}
.choice b{display:block;font-family:Unbounded;font-weight:600;font-size:15px}
.choice span{font-size:13px;color:var(--mut)}
.soon{grid-column:1/-1;text-align:center;font-size:13px;color:var(--mut)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:#0c0c0dee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 16px}
.region{justify-self:start;display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:999px;padding:6px 12px 6px 6px;min-height:40px;font-size:14px}
.region .fl{width:28px;height:28px}
.region svg.ch{opacity:.7}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo .fl{width:32px;height:32px}
.logo b{font-family:Unbounded;font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.tools{justify-self:end;display:flex;gap:4px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ib:hover{background:var(--card2)}
.fl{border-radius:7px;overflow:hidden;flex:none;display:block}
.chips{max-width:1060px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips button{flex:none;background:var(--card);border-radius:999px;padding:9px 15px;font-size:14px;min-height:40px}
.chips button.on{background:var(--ink);color:#000}
#search{max-width:1060px;margin:0 auto;padding:0 16px 12px}
#search input{width:100%;font-size:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px}

/* ---------- feed ---------- */
main{max-width:1060px;margin:0 auto;padding:20px 16px 40px}
.hero{position:relative;display:block;width:100%;text-align:left;border-radius:16px;overflow:hidden;min-height:420px;background:var(--card) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 20%,#000d 72%)}
.hero .in{position:absolute;left:0;right:0;bottom:0;padding:26px 24px;z-index:1}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;margin-right:6px}
.cat{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin:8px 0 6px}
.hero .h{font-size:clamp(24px,3.4vw,38px);max-width:22ch}
.hero ul{list-style:none;padding:0;margin:14px 0 0;font-size:15px}
.hero li{position:relative;padding-left:16px;margin:4px 0;color:#e9e9ec}
.hero li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--red)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 14px}
.sec .h{font-size:22px}
.sec span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 20px}
.card{display:flex;flex-direction:column;text-align:left;gap:8px;width:100%}
.thumb{aspect-ratio:16/10;border-radius:12px;background:var(--card) center/cover no-repeat;position:relative;overflow:hidden}
.thumb.none{display:grid;place-items:center;background:linear-gradient(135deg,#1f1f22,#141416)}
.thumb.none img{width:44%;opacity:.16}
.thumb .play{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:#000a;display:grid;place-items:center}
.card .k{color:var(--red);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card .h{font-size:17px;line-height:1.25}
.meta{color:var(--mut);font-size:13px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.text{background:var(--card);border-radius:14px;padding:18px;border-left:3px solid var(--red);flex:1}
.text .h{font-size:19px}
.digest{background:var(--card);border-radius:16px;padding:20px 22px;margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;text-align:left;width:100%}
.digest .moon{width:46px;height:46px;border-radius:12px;background:#2a2340;display:grid;place-items:center;font-size:22px}
.digest .h{font-size:18px;margin-bottom:6px}
.digest p{margin:0;color:#cfcfd4;font-size:15px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
footer{border-top:1px solid var(--line);color:var(--mut);font-size:13px}
footer div{max-width:1060px;margin:0 auto;padding:22px 16px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* ---------- article ---------- */
#post{max-width:720px;margin:0 auto;padding:18px 16px 60px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);min-height:44px;font-size:14px}
#post .h{font-size:clamp(26px,4vw,36px);margin:6px 0 12px}
#post>.meta{margin-bottom:18px}
#post figure{margin:18px 0;border-radius:14px;overflow:hidden}
#post figure img{width:100%;display:block}
#post .body p{font-size:17px;margin:0 0 16px}
.tg{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:12px;min-height:44px;margin-top:8px}

/* ---------- Движ (ehoschweiz) ---------- */
.seg{max-width:1060px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px}
.seg button{flex:1;max-width:260px;display:flex;flex-direction:column;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-height:52px;text-align:left}
.seg button b{font-family:Unbounded;font-weight:600;font-size:14px}
.seg button span{font-size:12px;color:var(--mut)}
.seg button.on{border-color:var(--red);background:#2a1215}
body.dz{--dz:#15111d;--y:#ffcf33;--co:#ff5a5f;--li:#c9b8ff;background:var(--dz)}
body.dz header{background:#15111dee}
.dg{font-family:"Dela Gothic One",Unbounded,sans-serif;font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
.dzwrap{max-width:1060px;margin:0 auto}
/* giveaway ticket */
.ticket{display:grid;grid-template-columns:240px minmax(0,1fr) 190px;background:var(--y);color:#15111d;border-radius:20px;position:relative;overflow:hidden}
.ticket .poster{display:block;background:#111;position:relative}
.ticket .poster{background:#141414}.ticket .poster img{width:100%;height:100%;object-fit:contain;display:block}
.ticket .main{padding:22px 24px;display:grid;gap:12px}
.ticket .kick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:600;font-size:13px}
.ticket .kick span{background:#15111d;color:var(--y);border-radius:999px;padding:4px 10px}
.ticket .dg{font-size:clamp(26px,4vw,40px)}
.ticket .info{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;font-weight:500}
.ticket .info b{font-weight:700}
.steps{display:grid;gap:6px;margin:2px 0 0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:10px;background:#15111d14;border-radius:12px;padding:8px 10px;font-size:14px}
.steps .st{flex:1}
.steps li a{flex:none;font-weight:700;text-decoration:none;background:#15111d;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.steps li.ok a{background:#2f9e5b}
.steps .n{width:24px;height:24px;border-radius:50%;background:#15111d;color:var(--y);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.join{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:#15111d;color:#fff;text-decoration:none;font-weight:700;border-radius:14px;min-height:48px;padding:0 20px}
.stub{border-left:3px dashed #15111d55;display:grid;place-items:center;text-align:center;padding:18px;gap:4px;position:relative}
.stub::before,.stub::after{content:"";position:absolute;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--dz)}
.stub::before{top:-12px}.stub::after{bottom:-12px}
.stub .big{font-family:"Dela Gothic One",Unbounded;font-size:64px;line-height:1}
.stub small{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stub .cd{font-size:13px;font-weight:600;background:#15111d;color:var(--y);border-radius:10px;padding:6px 10px;margin-top:6px}
/* filters */
.stick{display:flex;gap:8px;overflow-x:auto;padding:22px 0 16px;scrollbar-width:none}
.stick button{flex:none;border:2px solid #ffffff26;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:42px;transform:rotate(var(--r,0deg))}
.stick button.on{background:var(--li);color:#15111d;border-color:var(--li)}
/* board */
.board{columns:3 240px;column-gap:14px}
.tile{break-inside:avoid;margin:0 0 14px;display:block;width:100%;text-align:left;background:#211b2c;border-radius:16px;overflow:hidden}
.tile .ph{position:relative;background:#000}
.tile .ph img{width:100%;display:block;max-height:420px;object-fit:cover}
.tile .tb{padding:12px 14px 14px;display:grid;gap:6px}
.tile .tt{font-weight:600;font-size:16px;line-height:1.3}
.tile .mt{display:flex;gap:10px;color:#ffffff8c;font-size:12px;white-space:nowrap}
.pill{position:absolute;left:10px;top:10px;background:#000b;color:#fff;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600}
.pill.red{background:var(--red)}
.vplay{position:absolute;inset:0;display:grid;place-items:center}
.vplay span{width:60px;height:60px;border-radius:50%;background:#ffffff33;backdrop-filter:blur(6px);border:2px solid #ffffffb3;display:grid;place-items:center}
.note{background:var(--li);color:#15111d}.note .mt{color:#15111d99}
.note .q{font-family:"Dela Gothic One",Unbounded;font-size:44px;line-height:.6;margin-top:10px}
.word{background:var(--co);color:#fff}
.word .dg{font-size:34px;margin-top:4px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:#000a;display:grid;align-items:end;justify-items:center}
.sheet>div{width:min(640px,100%);max-height:92vh;overflow:auto;background:#1d1727;border-radius:22px 22px 0 0;padding:0 0 26px}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:22px}}
.sheet .ph img{width:100%;display:block;max-height:60vh;object-fit:contain;background:#000}
.sheet .kb img{animation:kb 9s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12)}}
.sheet .ph{position:relative;overflow:hidden}
.sheet .in{padding:18px 20px 0}
.sheet .dg{font-size:24px;margin:6px 0 12px}
.sheet p{margin:0 0 12px;color:#ffffffe0}
.x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:#000a;color:#fff;font-size:22px;z-index:2}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;background:var(--y);color:#15111d;font-weight:700;text-decoration:none;border-radius:999px;padding:0 20px;min-height:52px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #0008}
@media(max-width:860px){.ticket{grid-template-columns:200px minmax(0,1fr)}.stub{grid-column:1/-1}}
@media(max-width:600px){.ticket{grid-template-columns:minmax(0,1fr)}.ticket .poster img{aspect-ratio:1015/1280;height:auto}.stub{border-left:0;border-top:3px dashed #15111d55;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;text-align:left}.stub::before,.stub::after{display:none}.stub .big{order:-1;font-size:44px}.stub .pre{order:1}.stub .cd{order:2}.stub .cd{margin:0 0 0 auto}.steps li a{padding:6px 10px;font-size:12px}.fab{padding:0 16px;min-height:46px;font-size:14px}.board{columns:2 150px;column-gap:10px}.tile{margin-bottom:10px}.tile .tt{font-size:14px}.tile .tb{padding:10px}}
@media(prefers-reduced-motion:reduce){.sheet .kb img{animation:none}}
@media(max-width:860px){.row3,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row3>:last-child{display:none}}
@media(max-width:600px){
 .row3,.grid{grid-template-columns:minmax(0,1fr)}.row3>:last-child{display:flex}
 .hero{min-height:440px}.hero .in{padding:20px 18px}.hero li:nth-child(3){display:none}
 .choices{grid-template-columns:minmax(0,1fr);gap:8px}.choice{min-height:64px;padding:10px 14px}.choice img{width:52px;height:40px}#gslot{--g:max(220px,min(92vw,calc(100vh - 420px),calc(100dvh - 420px)))}.ptop p{font-size:14px;margin-top:6px}.ptop .h{font-size:26px}
 .region .nm{display:none}.region{padding:6px}
 .logo b{font-size:18px}
 .bar{grid-template-columns:auto 1fr auto}.logo{justify-self:center}
}
#picker.arrive>.ptop,#picker.arrive>.choices,#picker.arrive .hint{animation:fadeIn .4s .1s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeIn{from{opacity:0}}
#feedview.enter header{animation:fadeIn .3s cubic-bezier(.2,.7,.2,1) both}
#feedview.enter main>*,#feedview.enter .row3>*,#feedview.enter .grid>*:nth-child(-n+6),#feedview.enter .board,#feedview.enter .dzwrap>*{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both}
#feedview.enter main>:nth-child(1){animation-delay:.04s}
#feedview.enter .row3>:nth-child(1){animation-delay:.1s}#feedview.enter .row3>:nth-child(2){animation-delay:.14s}#feedview.enter .row3>:nth-child(3){animation-delay:.18s}
#feedview.enter main>:nth-child(n+3){animation-delay:.2s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.choice.on{border-color:var(--red);background:#2a1215}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="picker" class="view" hidden>
  <canvas id="globe" aria-label="Глобус: выберите страну"></canvas>
  <div class="ptop">
    <div class="brand"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#e4232f"/><g fill="none" stroke="#fff" stroke-width="1.8"><circle cx="16" cy="16" r="10"/><path d="M6 16h20M16 6c3 2.8 4.4 6.1 4.4 10S19 23.2 16 26c-3-2.8-4.4-6.1-4.4-10S13 8.8 16 6z"/></g></svg>Ne World</div>
    <h1 class="h">Где вы находитесь?</h1>
    <p>Русскоязычные новости там, где вы живёте. Выберите страну на глобусе — лента подстроится под неё.</p>
  </div>
  <div class="globewrap">
    <div id="gslot"></div>
    <div class="hint">Крутите глобус · нажмите на страну</div>
  </div>
  <div class="choices" id="choices"></div>
  <div id="tip"></div>
  <div id="veil"></div>
</section>

<section id="feedview" class="view" hidden>
  <header>
    <div class="bar">
      <button class="region" id="regionBtn" aria-label="Сменить страну"></button>
      <a class="logo" id="logo" href="#"></a>
      <div class="tools">
        <button class="ib" id="searchBtn" aria-label="Поиск"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button class="ib" id="globeBtn" aria-label="Глобус"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 3.9 5.5 3.9 9s-1.3 6.5-3.9 9c-2.6-2.5-3.9-5.5-3.9-9S9.4 5.5 12 3z"/></svg></button>
      </div>
    </div>
    <div id="search" hidden><input id="q" type="search" placeholder="Поиск по новостям" autocomplete="off"></div>
    <div class="seg" id="seg" hidden></div>
    <nav class="chips" id="chips"></nav>
  </header>
  <main id="feed"></main>
  <article id="post" hidden></article>
  <footer><div><span id="foot"></span><span>Прототип · посты — снимок Telegram-каналов на 27 ноября 2026</span></div></footer>
</section>

<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uid=0;
const flag=(r,cls='fl')=>{const i=++uid;return r==='ch'
 ?`<svg class="${cls}" viewBox="0 0 32 32"><rect width="32" height="32" fill="#e4232f"/><path d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z" fill="#fff"/></svg>`

  const f=at(e);hover=f;
  cv.className=f&&R_[f.reg]?'ptr':inSphere(e)?'grab':'';
  if(f){tip.innerHTML=R_[f.reg]?`<b>${R_[f.reg].label}</b> · ${R_[f.reg].name} — открыть ленту`:`${f.soon} · скоро`;
   tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.style.opacity=1}
  else tip.style.opacity=0;
 });
 cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');const was=down;down=null;if(was&&!moved){const f=at(e);if(f&&R_[f.reg])fly(f)}moved=false});
 cv.addEventListener('pointerleave',()=>{hover=null;tip.style.opacity=0});
 cv.addEventListener('wheel',e=>{if(flying||!inSphere(e))return;e.preventDefault();uz=Math.max(1,Math.min(3,uz*(e.deltaY<0?1.08:.93)))},{passive:false});
 addEventListener('resize',()=>{if(running)size()});
 fetch('world-110m.json').then(r=>r.json()).then(w=>{
  const o=w.objects.countries,gs=o.geometries;
  countries=topojson.feature(w,o);
  for(const f of countries.features){f.reg=f.id==='756'?'ch':f.id==='826'?'uk':null;f.soon=SOON[f.id]||null}
  landM=topojson.merge(w,gs.filter(g=>!SOON[g.id]&&g.id!=='756'&&g.id!=='826'));
  soonM=topojson.merge(w,gs.filter(g=>SOON[g.id]));
  borders=topojson.mesh(w,o,(a,b)=>a!==b);
  active=countries.features.filter(f=>f.reg);
  return fetch('world.json').then(r=>r.json()).then(w5=>{   // detailed shapes only for the two active countries
   const hi=topojson.feature(w5,{type:'GeometryCollection',geometries:w5.objects.countries.geometries.filter(g=>g.id==='756'||g.id==='826')});
   active=hi.features.map(f=>Object.assign(f,{reg:f.id==='756'?'ch':'uk'}));
  });
 }).catch(()=>{});
 return{start(back){if(running)return;running=true;cv.style.transition='none';cv.style.transform='';cv.style.opacity='';veil.style.opacity='';veil.style.transition='';size();flying=false;fly0=null;hover=null;uz=1;auto=true;intro=back?performance.now():0;raf=requestAnimationFrame(loop)},
        stop(){running=false;cancelAnimationFrame(raf);flying=false;fly0=null},
        fly(k){const f=countries&&countries.features.find(x=>x.reg===k);if(f)fly(f);else location.hash=k}};
})();

/* ---------- choices under the globe ---------- */
$('#choices').innerHTML=['ch','uk'].map(k=>`<button class="choice" data-r="${k}"><img src="${R[k].logo}" alt=""><span><b>${R[k].label}</b><span>${R[k].name} · ${R[k].subs}</span></span></button>`).join('')+
 `<div class="soon">Светлее отмечены страны, которые появятся следующими</div>`;

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-id]');if(c){location.hash=c.dataset.id;return}
 const ch=e.target.closest('.choice');if(ch){globe.fly(ch.dataset.r);return}
 const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
 const sh=e.target.closest('#sheet');if(sh&&(e.target===sh||e.target.closest('.x'))){closeSheet();return}
 const t=e.target.closest('[data-eho]');if(t){openSheet(t.dataset.eho);return}
 const f=e.target.closest('[data-dzf]');if(f){dzf=f.dataset.dzf;renderDvizh();return}
 const sb=e.target.closest('[data-sub]');if(sb){subs.add(+sb.dataset.sub);setTimeout(()=>{const y=scrollY;renderDvizh();scrollTo(0,y)},300)}
 const b=e.target.closest('#chips button');if(b){chip=b.textContent;renderFeed();return}
});
$('#regionBtn').onclick=$('#globeBtn').onclick=()=>{location.hash='globe'};
$('#searchBtn').onclick=()=>{const s=$('#search');s.hidden=!s.hidden;if(!s.hidden)$('#q').focus();else{query='';$('#q').value='';renderFeed()}};
$('#q').addEventListener('input',e=>{query=e.target.value.trim();location.hash.includes('dvizh')?renderDvizh():renderFeed()});
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

fetch('posts.json').then(r=>r.json()).then(d=>{DATA=d;route()}).catch(()=>{document.body.insertAdjacentHTML('beforeend','<p class="empty">Не удалось загрузить новости.</p>')});
}
</script>
</body>
</html>
