<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ne World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
/* VOICE: a Russian-language city newsroom at night: fast, confident, scannable.
   IDEA: the existing Ne Alpy site, plus a night-side globe you spin to pick your country.
   PICTURE: a dark globe with Switzerland and the UK lit red; the rest of the world waits in grey.
   COLOUR and TYPE: near-black ground, graphite cards, one red; Unbounded headlines, Onest body.
   LAYOUT: picker = globe centred with two country cards; feed = copy of the live site per region. */
:root{color-scheme:dark;--bg:#0c0c0d;--card:#1b1b1d;--card2:#242427;--line:#2c2c30;--ink:#f3f3f4;--mut:#9a9aa1;--red:#e4232f;--land:#2a2b30;--hi:#e4232f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.h{font-family:Unbounded,Onest,sans-serif;font-weight:800;line-height:1.12;text-wrap:balance;margin:0}
[hidden]{display:none!important}

/* ---------- picker ---------- */
#picker{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(120% 80% at 50% 45%,#17171b 0,#0c0c0d 60%)}
.ptop{padding:20px max(5vw,16px) 0;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:Unbounded;font-weight:800;font-size:20px;margin-bottom:10px}
.brand svg{width:34px;height:34px}
.ptop .h{font-size:clamp(28px,4.4vw,46px)}
.ptop p{color:var(--mut);margin:10px auto 0;max-width:46ch}
.globewrap{position:relative;display:grid;place-items:center;padding:8px 0}
#gslot{--g:max(240px,min(540px,92vw,calc(100vh - 390px),calc(100dvh - 390px)));width:var(--g);height:var(--g)}
#globe{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;z-index:0;will-change:transform,opacity}
#picker>.ptop,#picker>.globewrap,#picker>.choices{position:relative;z-index:1;pointer-events:none;transition:opacity .25s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1)}
#picker .choice{pointer-events:auto}
#picker.flying>.ptop{opacity:0;transform:translateY(-14px)}
#picker.flying>.choices,#picker.flying>.globewrap .hint{opacity:0;transform:translateY(14px)}
#picker .hint{transition:opacity .25s,transform .3s}
#veil{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:4;transition:opacity .3s cubic-bezier(.4,0,.2,1)}
#picker.out #veil{opacity:1}
#tip{z-index:5}
#soon{position:fixed;z-index:6;left:50%;width:min(340px,calc(100vw - 32px));transform:translate(-50%,8px) scale(.97);opacity:0;pointer-events:none;
 background:rgba(16,17,23,.94);border:1px solid #2c2e38;border-radius:18px;padding:18px 18px 16px;box-shadow:0 18px 50px #000a;backdrop-filter:blur(8px);
 transition:opacity .25s ease,transform .25s ease;text-align:left}
#soon.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#soon.sd{transform:translate(0,8px) scale(.97)}#soon.sd.on{transform:none}
#soon img{display:block;height:64px;width:auto;max-width:200px;margin:2px 0 12px}
#soon .sbadge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#e4232f;color:#fff;border-radius:999px;padding:3px 9px;margin-bottom:8px}
#soon h3{margin:0 0 2px;font-size:19px;font-weight:700;color:#fff}
#soon .ctry{color:#9a9ca6;font-size:13px;margin-bottom:10px}
#soon .hook{font-weight:600;color:#fff;margin:0 0 6px;font-size:15px}
#soon p.d{margin:0 0 12px;color:#c9cbd3;font-size:14px;line-height:1.45}
#soon .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#soon .tags span{font-size:12px;color:#d9dbe2;background:#24262f;border-radius:999px;padding:4px 10px}
#soon .foot{font-size:12px;color:#8d909b}
#soon .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:#24262f;color:#cfd1d8;font-size:18px;line-height:30px;cursor:pointer}
#globe.grab{cursor:grab}#globe.ptr{cursor:pointer}#globe.drag{cursor:grabbing}
#tip{position:fixed;pointer-events:none;background:#000c;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .12s}
#tip b{color:#fff;font-weight:600}#tip.act b{color:var(--red)}
.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--mut);white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(5,minmax(0,214px));gap:12px;justify-content:center;padding:4px max(5vw,16px) 18px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:76px;transition:border-color .15s,transform .15s}
.choice:hover,.choice.on{border-color:var(--red);transform:translateY(-2px)}
.choice img{width:64px;height:48px;object-fit:contain}
.choice b{display:block;font-family:Unbounded;font-weight:600;font-size:15px}
.choice span{font-size:13px;color:var(--mut)}
.soon{grid-column:1/-1;text-align:center;font-size:13px;color:var(--mut)}
.choice.next{position:relative;border-style:dashed;opacity:.92}
.choice.next:hover,.choice.next.on{border-color:#8a8a92}
.choice .badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#3a3b42;border-radius:999px;padding:3px 8px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:#0c0c0dee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 16px}
.region{justify-self:start;display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:999px;padding:6px 12px 6px 6px;min-height:40px;font-size:14px}
.region .fl{width:28px;height:28px}
.region svg.ch{opacity:.7}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo .fl{width:32px;height:32px}
.logo img{height:46px;width:auto;display:block}
.brandc{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:6px 0 4px}
.brandc img{height:64px;width:auto;flex:none}.brandc b{display:block;font-family:Unbounded;font-size:17px}.brandc small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.brandc .subs{margin-left:auto;background:var(--red);color:#fff;font-weight:600;font-size:14px;border-radius:999px;padding:9px 14px;white-space:nowrap}
.logo b{font-family:Unbounded;font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.tools{justify-self:end;display:flex;gap:4px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ib:hover{background:var(--card2)}
.fl{border-radius:7px;overflow:hidden;flex:none;display:block}
.chips{max-width:1060px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips button{flex:none;background:var(--card);border-radius:999px;padding:9px 15px;font-size:14px;min-height:40px}
.chips button.on{background:var(--ink);color:#000}
#search{max-width:1060px;margin:0 auto;padding:0 16px 12px}
#search input{width:100%;font-size:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px}

/* ---------- feed ---------- */
main{max-width:1060px;margin:0 auto;padding:20px 16px 40px}
.hero{position:relative;display:block;width:100%;text-align:left;border-radius:16px;overflow:hidden;min-height:420px;background:var(--card) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 20%,#000d 72%)}
.hero .in{position:absolute;left:0;right:0;bottom:0;padding:26px 24px;z-index:1}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;margin-right:6px}
.cat{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin:8px 0 6px}
.hero .h{font-size:clamp(24px,3.4vw,38px);max-width:22ch}
.hero ul{list-style:none;padding:0;margin:14px 0 0;font-size:15px}
.hero li{position:relative;padding-left:16px;margin:4px 0;color:#e9e9ec}
.hero li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--red)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 14px}
.sec .h{font-size:22px}
.sec span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 20px}
.card{display:flex;flex-direction:column;text-align:left;gap:8px;width:100%}
.thumb{aspect-ratio:16/10;border-radius:12px;background:var(--card) center/cover no-repeat;position:relative;overflow:hidden}
.thumb.none{display:grid;place-items:center;background:linear-gradient(135deg,#1f1f22,#141416)}
.thumb.none img{width:44%;opacity:.16}
.thumb .play{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:#000a;display:grid;place-items:center}
.card .k{color:var(--red);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card .h{font-size:17px;line-height:1.25}
.meta{color:var(--mut);font-size:13px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.text{background:var(--card);border-radius:14px;padding:18px;border-left:3px solid var(--red);flex:1}
.text .h{font-size:19px}
.digest{background:var(--card);border-radius:16px;padding:20px 22px;margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;text-align:left;width:100%}
.digest .moon{width:46px;height:46px;border-radius:12px;background:#2a2340;display:grid;place-items:center;font-size:22px}
.digest .h{font-size:18px;margin-bottom:6px}
.digest p{margin:0;color:#cfcfd4;font-size:15px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
footer{border-top:1px solid var(--line);color:var(--mut);font-size:13px}
footer div{max-width:1060px;margin:0 auto;padding:22px 16px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* ---------- article ---------- */
#post{max-width:720px;margin:0 auto;padding:18px 16px 60px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);min-height:44px;font-size:14px}
#post .h{font-size:clamp(26px,4vw,36px);margin:6px 0 12px}
#post>.meta{margin-bottom:18px}
#post figure{margin:18px 0;border-radius:14px;overflow:hidden}
#post figure img{width:100%;display:block}
#post .body p{font-size:17px;margin:0 0 16px}
.tg{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:12px;min-height:44px;margin-top:8px}

/* ---------- calm feed ---------- */
.lab{display:block;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.lab.urg{color:var(--red)}.lab.urg::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:2px}
.top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.lead{display:block;text-align:left;width:100%}
.lth,.rth,.sth{display:block;background:var(--card) center/cover no-repeat;position:relative}
.lth{aspect-ratio:16/9;border-radius:14px;margin-bottom:16px}
.lt{font-family:Unbounded,Onest,sans-serif;font-weight:600;font-size:clamp(22px,2.6vw,30px);line-height:1.18;margin:0 0 12px;text-wrap:balance}
.lb{list-style:none;padding:0;margin:0 0 12px;color:#cfcfd4;font-size:15px}
.lb li{position:relative;padding-left:14px;margin:3px 0}.lb li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:#6b6b73}
.also .sh,.dh{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 6px}
.side{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px 0;border-top:1px solid var(--line)}
.side:first-of-type{border-top:0}
.sth{width:84px;aspect-ratio:4/3;border-radius:8px;flex:none}
.st{display:block;font-weight:600;font-size:16px;line-height:1.3}.sm{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.night{display:block;width:100%;text-align:left;margin-top:24px;background:var(--card);border-radius:14px;padding:16px 18px}
.night .nh{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}.night .nh span{color:var(--mut);font-size:13px}
.night ul{margin:0;padding-left:18px;color:#cfcfd4;font-size:15px}.night li{margin:3px 0}
.day{margin-top:30px}
.dh{display:flex;gap:8px;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line);margin:0}
.dh b{color:var(--ink);font-size:15px;text-transform:none;letter-spacing:0}.dh span{text-transform:none;letter-spacing:0;font-weight:400}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:start;text-align:left;width:100%;padding:16px 0;border-bottom:1px solid var(--line)}
.row time{color:var(--mut);font-size:14px;padding-top:1px;font-variant-numeric:tabular-nums}
.rt{display:block;font-weight:600;font-size:17px;line-height:1.3}
.rs{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);font-size:15px;margin-top:4px}
.rth{width:128px;aspect-ratio:4/3;border-radius:10px}
.row:hover .rt,.side:hover .st,.lead:hover .lt{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pl{position:absolute;left:8px;bottom:8px;width:24px;height:24px;border-radius:50%;background:#000a}
.pl::after{content:"";position:absolute;left:9px;top:7px;border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
@media(max-width:860px){.top{grid-template-columns:minmax(0,1fr);gap:18px}}
@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr) auto;gap:12px}.row time{grid-column:1/-1;font-size:13px;margin-bottom:-8px}.rth{width:96px}.rt{font-size:16px}.rs{font-size:14px}}
/* ---------- live map ---------- */
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 0 #2ecc7199;animation:lv 1.8s infinite;margin-right:6px;vertical-align:middle}
@keyframes lv{70%{box-shadow:0 0 0 8px #2ecc7100}100%{box-shadow:0 0 0 0 #2ecc7100}}
.mstrip{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px;text-align:left;min-height:48px;font-size:14px}
.mstrip:hover{border-color:#2ecc7180}
.mstrip b{white-space:nowrap}.mstrip .mt{color:var(--mut);white-space:nowrap}
.mstrip .ms{color:#cfcfd4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.mstrip .mgo{color:#2ecc71;font-weight:600;white-space:nowrap}
.mapv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.mapcard{background:#151821;border:1px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:150px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}.mhead b{font-family:Unbounded;font-size:18px}
.vmap{position:relative}.vmap svg{display:block;width:100%;cursor:grab}
.klab{fill:#8b90a3;font-family:Onest,sans-serif;font-weight:600;pointer-events:none}
.mk{cursor:pointer}.mk rect{stroke:#0c0d12;stroke-width:1.5}.mk text{fill:#fff;font:700 11px Onest,sans-serif;pointer-events:none}
.mk .halo{fill:none;stroke-width:2;opacity:0}.mk.on .halo{opacity:1;animation:hal 1.4s infinite}
@keyframes hal{from{r:12;opacity:.9}to{r:24;opacity:0}}
.k-train rect,.mk.k-train .halo{fill:#e4232f;stroke:#e4232f}.k-road rect{fill:#c2410c}.mk.k-road .halo{stroke:#c2410c}.k-warn rect{fill:#7c5cff}.mk.k-warn .halo{stroke:#7c5cff}
.mk.k-train .halo{fill:none}
.bd{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:6px;font:700 11px Onest,sans-serif;color:#fff;flex:none}
.bd.k-train{background:#e4232f}.bd.k-road{background:#c2410c}.bd.k-warn{background:#7c5cff}.bd.k-aval{background:#d69e2e;color:#1a1300}
.vctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.vctl button{width:38px;height:38px;border-radius:10px;background:#0c0d12cc;border:1px solid #ffffff1f;color:#fff;font-size:18px}
.vpop{position:absolute;width:240px;background:#0c0d12f2;border:1px solid #ffffff26;border-radius:12px;padding:10px 12px;display:grid;gap:4px;box-shadow:0 10px 30px #000a;pointer-events:none}
.vpop .bd{justify-self:start}.vpop b{font-size:14px}.vpop small{color:#b9bdc9;font-size:13px}
.mleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 4px 0;font-size:12px;color:var(--mut)}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mleg .k-train{background:#e4232f}.mleg .k-road{background:#c2410c}.mleg .k-warn{background:#7c5cff}.mleg .k-aval{background:#4a3d22;outline:1px solid #d69e2e88}
.evl{display:grid;gap:2px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;padding:10px 8px;border-radius:10px}
.ev:hover,.ev.on{background:var(--card)}.ev b{display:block;font-size:15px}.ev small{display:block;color:var(--mut);font-size:13px;margin-top:2px}.ev em{font-style:normal;font-size:13px;color:#cfcfd4;white-space:nowrap}
.more2{font-size:13px;color:var(--mut);margin:2px 8px 6px}
.mimg{display:block;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#181a22}
.mimg{position:relative;width:100%;aspect-ratio:671/839;overflow:hidden;touch-action:pan-y;cursor:zoom-in}
.mimg img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none;will-change:transform}
.mimg.zoomed{touch-action:none;cursor:grab}
.zreset{position:absolute;left:10px;bottom:10px;background:#000c;color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:7px 12px;cursor:pointer}
.zline{font-size:13px;color:var(--mut);margin:8px 0 0}
.zhint{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:#000c;color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:7px 12px}
.zv{position:fixed;inset:0;z-index:80;background:#050506;touch-action:none;overflow:hidden;animation:fadeIn .2s both}
.zv img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;will-change:transform;max-width:none}
.zbar{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:2}
.zbar button{width:44px;height:44px;border-radius:50%;background:#222a;backdrop-filter:blur(6px);color:#fff;font-size:22px;display:grid;place-items:center;border:1px solid #ffffff22}
.ztip{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#000b;color:#ddd;font-size:13px;border-radius:999px;padding:7px 14px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.mlive{font-size:13px;color:#2ecc71;font-weight:600}
.minfo .h{font-size:clamp(26px,3.4vw,36px);margin:8px 0 16px}
.mstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.mstats div{background:var(--card);border-radius:12px;padding:12px 14px}
.mstats b{display:block;font-family:Unbounded;font-size:24px}
.mstats span{font-size:13px;color:var(--mut)}

const globe=(()=>{

 function inSphere(e){return Math.hypot(e.clientX-cx,e.clientY-cy)<R}

  for(const n of Object.values(NEXT)){const c=n.coord;if(d3.geoDistance(c,[-rot[0],-rot[1]])<1.45){const [x,y]=proj(c);if(Math.hypot(e.clientX-x,e.clientY-y)<14)return nextF.find(f=>f.next===n)||n.pseudo||(n.pseudo={next:n,properties:{}})}}

 const soon=$('#soon');

  soon.innerHTML=`<button class="x" aria-label="Закрыть">×</button><img src="${n.logo}" alt="${n.name}"><span class="sbadge">Скоро</span><h3>${n.name}</h3><div class="ctry">${n.label} · новый канал в Telegram</div><p class="hook">${n.hook}</p><p class="d">${n.desc}</p><div class="tags">${n.tags.map(t=>`<span>${t}</span>`).join('')}</div><div class="foot">Запуск совсем скоро — следите за Ne World</div>`;
  soon.querySelector('.x').onclick=e=>{e.stopPropagation();hideSoon()};
  const h=soon.offsetHeight||330,w=soon.offsetWidth||340;
  if(innerWidth<600){soon.classList.remove('sd');soon.style.left='50%';soon.style.top=Math.max(10,innerHeight-h-14)+'px'}
  else{soon.classList.add('sd');const left=x+48+w<innerWidth-12?x+48:Math.max(12,x-48-w);   // beside the country, not on top of it
   soon.style.left=left+'px';soon.style.top=Math.max(12,Math.min(innerHeight-h-12,y-h/2))+'px'}requestAnimationFrame(()=>soon.classList.add('on'))};
 const tipFor=f=>f.next?`<b>${f.next.label}</b> · ${f.next.name} — скоро`:R_[f.reg]?`<b>${R_[f.reg].label}</b> · ${R_[f.reg].name} — открыть ленту`:`<b>${esc(f.properties.ru||f.properties.name||'')}</b>${f.soon?' · скоро':''}`;
 let tipT=0;const showTip=(f,x,y,ms)=>{clearTimeout(tipT);tip.innerHTML=tipFor(f);tip.classList.toggle('act',!!R_[f.reg]);const tw=tip.offsetWidth;x=Math.max(tw/2+8,Math.min(innerWidth-tw/2-8,x));tip.style.left=x+'px';tip.style.top=y+'px';tip.style.opacity=1;if(ms)tipT=setTimeout(()=>{tip.style.opacity=0;hover=null},ms)};
 function fly(f){
  if(flying)return;
  document.querySelectorAll('.choice').forEach(c=>c.classList.toggle('on',c.dataset.r===f.reg));
  tip.style.opacity=0;hover=f;auto=false;
  const go=()=>{location.hash=f.reg};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!countries){go();return}
  const c=R_[f.reg].coord;
  flying=true;pk.classList.add('flying');veil.style.transition='none';
  fly0={t0:performance.now(),d:900,ir:d3.interpolate(rot.slice(),[-c[0],-c[1],0]),R0:R,cx0:cx,cy0:cy,Z:f.reg==='ch'?2.4:2.0,go,done:false};
 }
 let down=null,moved=false,pinch=null,uzT=null,lastTap=0,tpin=null;const tps=new Map();
 const mid=()=>{const [a,b]=[...tps.values()];return [(a[0]+b[0])/2,(a[1]+b[1])/2,Math.hypot(a[0]-b[0],a[1]-b[1])]};

  tps.set(e.pointerId,[e.clientX,e.clientY]);try{cv.setPointerCapture(e.pointerId)}catch(_){}

  else if(tps.size===2){const [mx,my,d]=mid();pinch={d,uz0:uz,mx,my,r0:rot.slice()};down=null;moved=true}});

  if(flying||tpin)return;

  if(tps.has(e.pointerId))tps.set(e.pointerId,[e.clientX,e.clientY]);

   const [mx,my,d]=mid(),k=75/R;uz=Math.max(1,Math.min(6,pinch.uz0*d/pinch.d));
   rot=[pinch.r0[0]+(mx-pinch.mx)*k,Math.max(-80,Math.min(80,pinch.r0[1]-(my-pinch.my)*k)),0];return}
  if(down){const dx=e.clientX-down[0],dy=e.clientY-down[1];if(Math.abs(dx)+Math.abs(dy)>4){moved=true;hideSoon()}
   const k=75/R;rot=[down[2]+dx*k,Math.max(-80,Math.min(80,down[3]-dy*k)),0];tip.style.opacity=0;return}
  if(e.pointerType==='touch')return;

 });
 const lift=e=>{if(!tps.has(e.pointerId))return;tps.delete(e.pointerId);
  if(tps.size<2)pinch=null;
  if(tps.size===1){const [p]=[...tps.values()];down=[p[0],p[1],rot[0],rot[1]];moved=true;return}   // keep turning with the finger that stays
  cv.classList.remove('drag');const was=down;down=null;
  if(e.type==='pointerup'&&was&&!moved){const f=at(e);if(f&&R_[f.reg]){fly(f)}else if(f&&f.next){api.peek(f.next.id)}else{hideSoon();
    if(f){hover=f;showTip(f,e.clientX,e.clientY,e.pointerType==='mouse'?0:2600)}else{hover=null;tip.style.opacity=0}
    const now=e.timeStamp;if(now-lastTap<320){uzT=uz>1.3?1:2.5;lastTap=0}else lastTap=now}}moved=false};

  if(e.touches.length>=2){e.preventDefault();const [mx,my,d]=tmid(e.touches);tpin={d,uz0:uz,mx,my,r0:rot.slice()};
   down=null;pinch=null;tps.clear();moved=true;auto=false;intro=0;uzT=null;tip.style.opacity=0;hideSoon()}},{passive:false});

  rot=[tpin.r0[0]+(mx-tpin.mx)*k,Math.max(-80,Math.min(80,tpin.r0[1]-(my-tpin.my)*k)),0]},{passive:false});

 // stop Safari from zooming the whole page instead of the globe
 ['gesturestart','gesturechange','gestureend'].forEach(t=>pk.addEventListener(t,e=>e.preventDefault(),{passive:false}));

 fetch('world-110m.json').then(r=>r.json()).then(w=>{
  const o=w.objects.countries,gs=o.geometries;

/* ---------- choices under the globe ---------- */
$('#choices').innerHTML=['ch','uk'].map(k=>`<button class="choice" data-r="${k}"><img src="${R[k].logo}" alt=""><span><b>${R[k].label}</b><span>${R[k].name} · ${R[k].subs}</span></span></button>`).join('')+

 `<div class="soon">Светлее отмечены страны, которые появятся следующими</div>`;

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-id]');if(c){location.hash=c.dataset.id;return}
 const nx=e.target.closest('[data-next]');if(nx){globe.peek(nx.dataset.next);return}
 const ch=e.target.closest('.choice');if(ch){globe.fly(ch.dataset.r);return}
 const zb=e.target.closest('[data-zoom]');if(zb){openZoom(zb.dataset.zoom);return}
 const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
 const sh=e.target.closest('#sheet');if(sh&&(e.target===sh||e.target.closest('.x'))){closeSheet();return}
 const t=e.target.closest('[data-eho]');if(t){openSheet(t.dataset.eho);return}
 const f=e.target.closest('[data-dzf]');if(f){dzf=f.dataset.dzf;renderDvizh();return}
 const sb=e.target.closest('[data-sub]');if(sb){subs.add(+sb.dataset.sub);setTimeout(()=>{const y=scrollY;renderDvizh();scrollTo(0,y)},300)}
 const b=e.target.closest('#chips button');if(b){chip=b.textContent;renderFeed();return}
});
$('#regionBtn').onclick=$('#globeBtn').onclick=()=>{location.hash='globe'};
$('#searchBtn').onclick=()=>{const s=$('#search');s.hidden=!s.hidden;if(!s.hidden)$('#q').focus();else{query='';$('#q').value='';renderFeed()}};
$('#q').addEventListener('input',e=>{query=e.target.value.trim();location.hash.includes('dvizh')?renderDvizh():renderFeed()});
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

const postsURL=()=>'posts.json?v='+Math.floor(Date.now()/6e4);
// new Telegram posts arrive in posts.json via the bot; pick them up while the page is open
function refreshPosts(){fetch(postsURL()).then(r=>r.ok?r.json():null).then(d=>{if(!d||JSON.stringify(d)===JSON.stringify(DATA))return;DATA=d;
  if(['ch','uk','ch-dvizh'].includes(location.hash.slice(1))&&scrollY<300)route()}).catch(()=>{})}
Promise.all([fetch(postsURL()).then(r=>r.json()),loadUK()]).then(([d])=>{DATA=d;route();setInterval(refreshPosts,12e4);setInterval(()=>loadUK().then(()=>{if(location.hash==='#uk-map')renderMapUK()}),12e4)}).catch(()=>{document.body.insertAdjacentHTML('beforeend','<p class="empty">Не удалось загрузить новости.</p>')});
}
