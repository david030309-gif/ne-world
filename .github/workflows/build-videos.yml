name: Build country videos
on:
  push:
    branches: [main]
    paths: ["video/sources.json", "scripts/build-videos.sh"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-videos
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download the Mixkit clips and cut one loop per country
        run: scripts/build-videos.sh
      - name: Commit
        run: |
          git config user.name "ne-world-bot"
          git config user.email "ne-world-bot@users.noreply.github.com"
          git add video
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Country videos rebuilt"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
