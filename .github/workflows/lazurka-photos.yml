name: Ne Lazurka photos
on:
  push:
    branches: [main]
    paths: ["lazurka.json", "scripts/lazurka-photos.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lazurka-photos
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Find free-licensed photos on Wikimedia Commons
        run: node scripts/lazurka-photos.mjs
      - name: Commit
        run: |
          git config user.name "ne-world-bot"
          git config user.email "ne-world-bot@users.noreply.github.com"
          git add lazurka.json img/mc
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Ne Lazurka photos from Wikimedia Commons"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
