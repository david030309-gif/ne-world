name: Update live map
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-map
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch official data
        env:
          OTD_API_KEY: ${{ secrets.OTD_API_KEY }}
        run: node scripts/update-map.mjs
      - name: Commit if changed
        run: |
          git config user.name "ne-world-bot"
          git config user.email "ne-world-bot@users.noreply.github.com"
          git add map/ch-live.json map/ch-avalanche.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Live map data update" && git push; fi
