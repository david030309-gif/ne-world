name: Nice transit lines
on:
  schedule: [{ cron: "17 3 * * 1" }]
  push:
    branches: [main]
    paths: ["scripts/nice-transit.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save gtfs-realtime-bindings@1
      - name: Build map/nice-transit.json from the open Lignes d'Azur GTFS
        run: node scripts/nice-transit.mjs
      - name: Commit
        run: |
          git config user.name "ne-world-bot"
          git config user.email "ne-world-bot@users.noreply.github.com"
          git add map/nice-transit.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Nice transit lines updated"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
